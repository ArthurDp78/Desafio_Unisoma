name: Build Windows executable

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.spec"
      - "*.txt"
      - "*.html"
      - "ui/**"
      - "assets/**"
      - ".gitattributes"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare Chromium for the manual PDF
        run: python -m playwright install chromium --only-shell

      - name: Build executable
        run: python -m PyInstaller --noconfirm ABC_Aprendiz.spec

      - name: Copy executable to repository root
        shell: pwsh
        run: Copy-Item dist/ABC_Aprendiz.exe ABC_Aprendiz.exe -Force

      - name: Commit executable to main
        shell: pwsh
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ABC_Aprendiz.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Executable is already up to date."
            exit 0
          }
          git commit -m "build: update Windows executable"
          git push origin HEAD:main
